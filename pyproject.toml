[project]
name = "live-translate"
version = "0.1.0"
description = "Real-time AI subtitles for any audio playing on Windows: local Whisper speech translation shown as a live caption overlay."
readme = "README.md"
keywords = ["live-translation", "subtitles", "live-captions", "whisper", "faster-whisper", "speech-translation", "speech-to-text", "japanese", "anime", "wasapi-loopback", "pyside6", "offline"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Environment :: GPU :: NVIDIA CUDA",
]

requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.5",
    "pyside6>=6.12.0",
    "soundcard>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/Tuhin-thinks/live-translate"
Issues = "https://github.com/Tuhin-thinks/live-translate/issues"
